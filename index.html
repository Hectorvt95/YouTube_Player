<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="theme-color" content="#0f0f13" />
  <title>YT Music Streamer</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1b1b22;
      --surface-hover: #252530;
      --accent: #ff3b5c;
      --accent-soft: rgba(255, 59, 92, 0.18);
      --text: #f4f4f6;
      --muted: #a1a1b0;
      --border: #2c2c38;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 540px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 28px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .icon-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .banner {
      background: rgba(255, 165, 0, 0.14);
      border: 1px solid #f59e0b;
      color: #fde68a;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.82rem;
      line-height: 1.4;
      display: none;
    }

    .banner.visible { display: block; }

    .api-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .api-box.open { display: flex; }

    .api-box label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .row {
      display: flex;
      gap: 8px;
    }

    input[type="text"], input[type="password"] {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .chips::-webkit-scrollbar { display: none; }

    .chip {
      flex: 0 0 auto;
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent-soft);
      color: var(--text);
      border-color: var(--accent);
    }

    .player-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
    }

    .player-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .player-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 16px;
      pointer-events: none;
    }

    .now-playing {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .now-playing.visible { display: flex; }

    .np-info { min-width: 0; flex: 1; }

    .np-title {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .np-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .np-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .ctrl-btn.play {
      background: var(--accent);
      border-color: var(--accent);
    }

    .status {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      padding: 6px 12px;
    }

    .status.error { color: #ff6b81; }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .track:hover { background: var(--surface-hover); }

    .track.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .track img {
      width: 72px;
      height: 54px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
      background: #000;
    }

    .track-meta { min-width: 0; flex: 1; }

    .track-title {
      font-size: 0.88rem;
      font-weight: 500;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .track-artist {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .queue-add {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>YT Music Streamer</h1>
      <button class="icon-btn" id="toggle-key-btn">API Key</button>
    </header>

    <div class="banner" id="origin-banner">
      <strong>Local file detected (<code>file://</code>):</strong> YouTube blocks embeds that do not come from an <code>http://</code> or <code>https://</code> address (causing <strong>Error 153</strong>). Serve this file via <code>http://localhost:8080</code> or host it on GitHub Pages / Netlify Drop.
    </div>

    <div class="api-box" id="api-box">
      <label for="api-key-input">YouTube Data API v3 Key (saved locally in browser)</label>
      <div class="row">
        <input type="password" id="api-key-input" placeholder="Paste your AIza... key" />
        <button class="btn-primary" id="save-key-btn">Save</button>
      </div>
    </div>

    <form class="row" id="search-form">
      <input type="text" id="search-input" placeholder="Search songs, artists, or albums..." />
      <button class="btn-primary" type="submit">Search</button>
    </form>

    <div class="chips" id="chips"></div>

    <div class="player-wrap" id="player-wrap">
      <div class="player-placeholder" id="placeholder">
        Search a song and tap to play
      </div>
    </div>

    <div class="now-playing" id="now-playing">
      <div class="np-info">
        <div class="np-title" id="np-title"></div>
        <div class="np-sub" id="np-sub"></div>
      </div>
      <div class="np-controls">
        <button class="ctrl-btn" id="prev-btn" title="Previous">⏮</button>
        <button class="ctrl-btn play" id="play-btn" title="Play/Pause">▶</button>
        <button class="ctrl-btn" id="next-btn" title="Next">⏭</button>
      </div>
    </div>

    <div class="status" id="status"></div>
    <div class="track-list" id="track-list"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const GENRES = ["Lo-Fi Beats", "Synthwave", "Acoustic", "Jazz", "Rock", "Classical"];
    const STORAGE_KEY = "yt_music_api_key";

    let apiKey = localStorage.getItem(STORAGE_KEY) || "";
    let ytApiReady = false;
    let player = null;
    let playerReady = false;
    let playerIframe = null;
    let useNoCookie = false;
    let retried153 = false;
    let loadedVideoId = null;

    let searchResults = [];
    let queue = [];
    let currentIndex = -1;
    let isPlaying = false;

    const originBanner = document.getElementById("origin-banner");
    const apiBox = document.getElementById("api-box");
    const apiKeyInput = document.getElementById("api-key-input");
    const toggleKeyBtn = document.getElementById("toggle-key-btn");
    const saveKeyBtn = document.getElementById("save-key-btn");
    const searchForm = document.getElementById("search-form");
    const searchInput = document.getElementById("search-input");
    const chipsEl = document.getElementById("chips");
    const playerWrap = document.getElementById("player-wrap");
    const placeholderEl = document.getElementById("placeholder");
    const nowPlayingEl = document.getElementById("now-playing");
    const npTitleEl = document.getElementById("np-title");
    const npSubEl = document.getElementById("np-sub");
    const prevBtn = document.getElementById("prev-btn");
    const playBtn = document.getElementById("play-btn");
    const nextBtn = document.getElementById("next-btn");
    const statusEl = document.getElementById("status");
    const trackListEl = document.getElementById("track-list");

    window.onYouTubeIframeAPIReady = () => { ytApiReady = true; };

    function decodeHtml(str) {
      return new DOMParser().parseFromString(str, "text/html").documentElement.textContent || "";
    }

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = isError ? "status error" : "status";
    }

    function buildEmbedUrl(videoId) {
      const host = useNoCookie
        ? "https://www.youtube-nocookie.com"
        : "https://www.youtube.com";

      const params = new URLSearchParams({
        autoplay: "1",
        playsinline: "1",
        controls: "1",
        rel: "0",
        enablejsapi: "1"
      });

      if (/^https?:$/.test(window.location.protocol)) {
        params.set("origin", window.location.origin);
      }

      return `${host}/embed/${encodeURIComponent(videoId)}?${params.toString()}`;
    }

    function mountIframeAndPlayer(videoId) {
      if (player && typeof player.destroy === "function") {
        player.destroy();
      }
      if (playerIframe) {
        playerIframe.remove();
      }

      player = null;
      playerReady = false;
      loadedVideoId = videoId;

      // Create iframe explicitly WITH referrerpolicy before YT.Player attaches
      playerIframe = document.createElement("iframe");
      playerIframe.id = "yt-player-frame";
      playerIframe.title = "YouTube music player";
      playerIframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
      playerIframe.allowFullscreen = true;
      playerIframe.referrerPolicy = "strict-origin-when-cross-origin";
      playerIframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
      playerIframe.src = buildEmbedUrl(videoId);

      playerWrap.prepend(playerIframe);

      if (ytApiReady && window.YT && window.YT.Player) {
        attachYtPlayer();
      } else {
        const waitInterval = setInterval(() => {
          if (window.YT && window.YT.Player) {
            clearInterval(waitInterval);
            ytApiReady = true;
            attachYtPlayer();
          }
        }, 150);
      }
    }

    function attachYtPlayer() {
      if (!playerIframe || player) return;
      player = new YT.Player(playerIframe, {
        events: {
          onReady: () => {
            playerReady = true;
            const current = queue[currentIndex];
            if (current && current.videoId !== loadedVideoId) {
              loadedVideoId = current.videoId;
              player.loadVideoById(current.videoId);
            }
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.PLAYING) {
              isPlaying = true;
              playBtn.textContent = "⏸";
              setStatus("");
            } else if (event.data === YT.PlayerState.PAUSED) {
              isPlaying = false;
              playBtn.textContent = "▶";
            } else if (event.data === YT.PlayerState.ENDED) {
              isPlaying = false;
              playBtn.textContent = "▶";
              if (currentIndex < queue.length - 1) {
                playAtIndex(currentIndex + 1);
              }
            }
          },
          onError: (e) => {
            if (e.data === 153) {
              if (!retried153) {
                retried153 = true;
                useNoCookie = !useNoCookie;
                setStatus("Retrying embed with privacy-enhanced player...");
                const current = queue[currentIndex];
                if (current) mountIframeAndPlayer(current.videoId);
                return;
              }
              setStatus(
                "Error 153: YouTube requires an http:// or https:// page with Referer headers enabled (check file:// URL or ad-blocker/privacy shields).",
                true
              );
              return;
            }

            setStatus(`Track unavailable for embedding (Error ${e.data}). Skipping...`, true);
            if (currentIndex < queue.length - 1) {
              setTimeout(() => playAtIndex(currentIndex + 1), 1000);
            }
          }
        }
      });
    }

    function renderChips(activeTerm = "") {
      chipsEl.innerHTML = "";
      GENRES.forEach((genre) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip" + (activeTerm.toLowerCase() === genre.toLowerCase() ? " active" : "");
        btn.textContent = genre;
        btn.addEventListener("click", () => {
          searchInput.value = genre;
          searchSongs(genre);
        });
        chipsEl.appendChild(btn);
      });
    }

    async function searchSongs(query) {
      const q = query.trim();
      if (!q) return;
      if (!apiKey) {
        apiBox.classList.add("open");
        setStatus("Please enter and save your YouTube Data API v3 key first.", true);
        return;
      }

      renderChips(q);
      setStatus("Searching YouTube...");
      trackListEl.innerHTML = "";

      try {
        const params = new URLSearchParams({
          part: "snippet",
          type: "video",
          videoCategoryId: "10",
          videoEmbeddable: "true",
          maxResults: "20",
          q,
          key: apiKey
        });

        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?${params}`);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data?.error?.message || `HTTP ${res.status}`);
        }

        searchResults = (data.items || []).map((item) => ({
          videoId: item.id.videoId,
          title: decodeHtml(item.snippet.title),
          artist: decodeHtml(item.snippet.channelTitle),
          thumbnail: item.snippet.thumbnails?.medium?.url || ""
        }));

        if (searchResults.length === 0) {
          setStatus("No embeddable music videos found.");
          return;
        }

        setStatus("");
        renderTracks();
      } catch (err) {
        setStatus(`Error: ${err.message}`, true);
      }
    }

    function renderTracks() {
      trackListEl.innerHTML = "";
      const activeId = queue[currentIndex]?.videoId;

      searchResults.forEach((track, idx) => {
        const row = document.createElement("div");
        row.className = "track" + (track.videoId === activeId ? " active" : "");

        const img = document.createElement("img");
        if (track.thumbnail.startsWith("https://")) img.src = track.thumbnail;
        img.alt = track.title;

        const meta = document.createElement("div");
        meta.className = "track-meta";

        const title = document.createElement("div");
        title.className = "track-title";
        title.textContent = track.title;

        const artist = document.createElement("div");
        artist.className = "track-artist";
        artist.textContent = track.artist;

        meta.append(title, artist);

        const queueBtn = document.createElement("button");
        queueBtn.className = "queue-add";
        queueBtn.type = "button";
        queueBtn.textContent = "+ Queue";
        queueBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          addToQueue(track);
        });

        row.append(img, meta, queueBtn);
        row.addEventListener("click", () => {
          queue = [...searchResults];
          playAtIndex(idx);
        });

        trackListEl.appendChild(row);
      });
    }

    function addToQueue(track) {
      if (!queue.some((t) => t.videoId === track.videoId)) {
        queue.push(track);
        if (currentIndex === -1) {
          playAtIndex(0);
        } else {
          updateNowPlayingUI();
        }
      }
    }

    function playAtIndex(index) {
      if (index < 0 || index >= queue.length) return;
      currentIndex = index;
      retried153 = false;
      const track = queue[currentIndex];
      placeholderEl.style.display = "none";
      setStatus("");
      updateNowPlayingUI();
      renderTracks();

      if (!playerIframe) {
        mountIframeAndPlayer(track.videoId);
      } else if (player && playerReady) {
        loadedVideoId = track.videoId;
        player.loadVideoById(track.videoId);
      } else {
        mountIframeAndPlayer(track.videoId);
      }
    }

    function updateNowPlayingUI() {
      const track = queue[currentIndex];
      if (!track) return;
      nowPlayingEl.classList.add("visible");
      npTitleEl.textContent = track.title;
      npSubEl.textContent = `${track.artist} • Track ${currentIndex + 1}/${queue.length}`;
    }

    toggleKeyBtn.addEventListener("click", () => {
      apiBox.classList.toggle("open");
      apiKeyInput.value = apiKey;
    });

    saveKeyBtn.addEventListener("click", () => {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem(STORAGE_KEY, apiKey);
      apiBox.classList.remove("open");
      setStatus(apiKey ? "API key saved. Search for a song!" : "API key cleared.");
      if (apiKey && searchInput.value.trim()) searchSongs(searchInput.value);
    });

    searchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      searchSongs(searchInput.value);
    });

    playBtn.addEventListener("click", () => {
      if (!player || !playerReady) return;
      if (isPlaying) player.pauseVideo();
      else player.playVideo();
    });

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) playAtIndex(currentIndex - 1);
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex < queue.length - 1) playAtIndex(currentIndex + 1);
    });

    // Init
    if (!/^https?:$/.test(window.location.protocol)) {
      originBanner.classList.add("visible");
    }
    if (!apiKey) apiBox.classList.add("open");
    renderChips();
    if (apiKey) {
      searchInput.value = "Lo-Fi Beats";
      searchSongs("Lo-Fi Beats");
    }
  </script>
</body>
</html>
